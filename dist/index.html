<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111722" />
  <title>Caseboard — 推理工作台</title>
  <meta name="description" content="把线索、证据和推断放到同一张推理板上。" />
  <style>
    :root{--ink:#111722;--rail:#171f2d;--paper:#f7f1df;--paper2:#eee4ca;--muted:#8e98a9;--red:#e5534b;--red2:#ff7168;--line:#d5c7a7;--gold:#e5b55c}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:#eff2f7;font:15px/1.45 ui-rounded,"SF Pro Rounded","PingFang SC",system-ui,sans-serif;overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:260px 1fr 315px}.side{background:var(--rail);border-right:1px solid #2b3545;padding:24px 18px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.02em}.brand-mark{width:31px;height:31px;border:2px solid var(--red2);border-radius:50%;display:grid;place-items:center;color:var(--red2);font-size:17px}.case-name{background:#202a3b;border:1px solid #344158;border-radius:11px;padding:13px}.case-name small,.section-title{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}.case-name strong{font-size:15px}.section-title{margin:0 0 8px}.legend{display:grid;gap:7px}.legend div{color:#cad0da;font-size:13px;display:flex;align-items:center;gap:9px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.dot.lead{background:var(--gold)}.dot.source{background:#77b7d5}.dot.idea{background:#c68bf1}.dot.question{background:var(--red2)}.scale-guide{color:#aeb8c8;font-size:12px;line-height:1.55;margin:0}.style-row{display:flex;align-items:center;justify-content:space-between;color:#cad0da;font-size:13px;margin:8px 0}.style-row input{width:34px;height:25px;padding:1px;border:1px solid #536074;border-radius:5px;background:transparent}.side-foot{margin-top:auto;color:var(--muted);font-size:12px}.workspace{min-width:0;display:grid;grid-template-rows:74px 1fr;background:radial-gradient(circle at 63% 35%,#253248 0,#151d2a 44%,#101722 100%)}.toolbar{display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid #2b3545}.toolbar h1{font-size:17px;margin:0 auto 0 0}.toolbar h1 span{color:var(--muted);font-size:12px;font-weight:500;margin-left:8px}.btn{border:1px solid #3b4658;background:#202a3a;color:#eff2f7;border-radius:8px;padding:9px 11px;font:inherit;cursor:pointer}.btn:hover{border-color:#71809a}.btn.primary{background:var(--red);border-color:var(--red);font-weight:700}.btn.active{outline:2px solid var(--gold);outline-offset:2px}.zoom{font-variant-numeric:tabular-nums;color:#c9d1dc;font-size:12px;min-width:42px;text-align:center}.board-wrap{position:relative;overflow:hidden;cursor:grab;background-image:linear-gradient(rgba(172,190,213,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(172,190,213,.10) 1px,transparent 1px);background-size:32px 32px}.board-wrap.panning{cursor:grabbing}.board-wrap.linking .card{cursor:crosshair}.stage{position:absolute;inset:0;transform-origin:0 0}.board{position:absolute;inset:0;overflow:visible}.strings{position:absolute;inset:0;pointer-events:none;overflow:visible}.card{position:absolute;width:185px;min-height:104px;background:var(--paper);color:#202630;border:1px solid var(--line);border-radius:4px;padding:13px 14px 12px;box-shadow:0 9px 18px rgba(0,0,0,.24);cursor:grab;transform:rotate(var(--tilt));user-select:none}.card.world{width:286px;min-height:154px;background:#fff6df;border-color:#d9b15e}.card.research{width:228px;min-height:123px;background:#f3e9ff;border-color:#bd8ee4}.card.mechanism{width:185px;min-height:104px}.card.evidence{width:142px;min-height:76px;padding:10px 11px;background:#e9f3f7;border-color:#8ebdd4}.card.evidence .title{font-size:13px}.card.evidence .excerpt{font-size:11px;-webkit-line-clamp:1}.card:active{cursor:grabbing}.card.selected{outline:3px solid var(--red2);outline-offset:3px}.card.target{outline:3px solid var(--gold);outline-offset:3px}.pin{position:absolute;z-index:2;left:50%;top:-14px;transform:translateX(-50%);width:28px;height:28px;border:0;border-radius:50%;background:var(--type);color:#fff;box-shadow:0 2px 5px #0006;cursor:pointer;font-size:15px;line-height:28px;padding:0}.pin:hover{transform:translateX(-50%) scale(1.12)}.card .kind{color:#6e7480;text-transform:uppercase;font-size:10px;letter-spacing:.1em;font-weight:800}.card .title{font-family:ui-serif,Georgia,serif;font-weight:700;font-size:16px;line-height:1.23;margin:5px 0}.card .excerpt{font-size:12px;color:#555e68;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.stage.far .card{min-height:16px!important;width:16px!important;height:16px!important;padding:0;border-radius:50%;box-shadow:0 2px 8px #0006}.stage.far .card>*{display:none}.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#8d9aad;text-align:center}.inspector{background:#f4f5f8;color:#202630;padding:22px 20px;border-left:1px solid #ccd2dc;overflow:auto}.inspector h2{font-size:18px;margin:3px 0 16px}.empty-note{color:#707b89;font-size:14px;line-height:1.6}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:11px;font-weight:800;color:#687384;letter-spacing:.08em;text-transform:uppercase}.field input,.field textarea,.field select{width:100%;border:1px solid #ccd3dd;border-radius:7px;padding:9px;background:white;color:#202630;font:inherit}.field textarea{resize:vertical;min-height:96px}.inspector .btn{color:#202630;background:#fff;border-color:#c4ccd8}.inspector .btn.primary{color:#fff;background:var(--red);border-color:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.connection-help{background:#fff4d8;border:1px solid #f0d28e;border-radius:8px;padding:9px 10px;color:#714f10;font-size:13px;margin:12px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);background:#eef2f8;color:#172030;padding:10px 14px;border-radius:8px;box-shadow:0 8px 25px #0005;transition:.25s;z-index:5}.toast.show{transform:translateX(-50%) translateY(0)}@media(max-width:900px){.app{grid-template-columns:0 1fr}.side{display:none}.inspector{position:fixed;z-index:4;right:0;top:0;bottom:0;width:min(315px,88vw);transform:translateX(100%);transition:.25s;box-shadow:-5px 0 25px #0004}.inspector.open{transform:none}.toolbar{padding:0 14px}.toolbar h1 span{display:none}.btn{padding:8px}.card{width:172px}}
    .app{--left-width:260px;--right-width:315px;grid-template-columns:var(--left-width) minmax(0,1fr) var(--right-width)}
    .app.left-collapsed{--left-width:0px}.app.right-collapsed{--right-width:0px}
    .side{grid-column:1;grid-row:1;min-height:0;overflow:auto}.workspace{grid-column:2;grid-row:1;min-height:0;grid-template-rows:auto minmax(0,1fr)}
    .inspector{grid-column:3;grid-row:1;min-height:0}.side[hidden],.inspector[hidden]{display:none!important}
    .toolbar{min-height:74px;flex-wrap:wrap;padding:12px 16px;gap:8px}.toolbar .btn{white-space:nowrap}
    .panel-close{align-self:flex-end;font-size:12px;padding:5px 9px}.inspector>.panel-close{display:block;margin:0 0 14px auto}
    .btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
    @media(max-width:900px){
      .app{grid-template-columns:0 minmax(0,1fr) 0}
      .side,.inspector{position:fixed;z-index:4;top:0;bottom:0;width:min(315px,88vw);transform:none;transition:none;box-shadow:0 0 25px #0004}
      .side{display:flex;left:0}.inspector{right:0}.toolbar h1{font-size:15px}
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="side" id="sidebar"><button class="btn panel-close" id="closeSidebar" aria-label="收起案件侧栏">收起 ‹</button><div class="brand"><span class="brand-mark">⌕</span> Caseboard</div><div class="case-name"><small>当前案件</small><strong id="caseTitle">关于“AI 与人的位置”</strong></div><section><p class="section-title">线索类型</p><div class="legend"><div><i class="dot lead"></i>线索</div><div><i class="dot source"></i>来源</div><div><i class="dot idea"></i>推断</div><div><i class="dot question"></i>待问问题</div></div></section><section><p class="section-title">案件风格</p><label class="style-row">板面颜色 <input type="color" id="boardColor" value="#1b2738"></label><label class="style-row">连线颜色 <input type="color" id="lineColor" value="#d95650"></label></section><div class="side-foot">卡片会自动保存在这台设备上。<br>你不是在收集答案，而是在留下推理的轨迹。</div></aside>
    <section class="workspace"><header class="toolbar"><button class="btn" id="toggleSidebar" aria-controls="sidebar" aria-expanded="true">案件</button><h1>推理板 <span id="count"></span></h1><button class="btn" id="zoomOut" aria-label="缩小">－</button><span class="zoom" id="zoomLabel">100%</span><button class="btn" id="zoomIn" aria-label="放大">＋</button><button class="btn" id="linkBtn">连线</button><button class="btn primary" id="addBtn">＋ 新线索</button><button class="btn" id="toggleInspector" aria-controls="inspector" aria-expanded="true">详情</button></header><div class="board-wrap"><div class="stage" id="stage"><div class="board" id="board"><svg class="strings" id="strings"></svg><div class="empty" id="empty" hidden>从一张线索卡开始。<br>不必急着知道结论。</div></div></div></div></section>
    <aside class="inspector" id="inspector"><button class="btn panel-close" id="closeInspector" aria-label="收起详情侧栏">收起 ›</button><div id="inspectorContent"><h2>放大一张卡片</h2><p class="empty-note">点一下线索卡，就可以记录它的来源、你的疑问，以及它和别的线索之间的关系。</p></div></aside>
  </main><div class="toast" id="toast"></div>
  <script>
  const DEFAULT={caseTitle:'关于“AI 与人的位置”',cards:[
   {id:'a',kind:'线索',title:'AI 让“会做”变得廉价',note:'模型能很快生成代码、总结、推导。但这不等于问题已经被解决。',x:94,y:116,tilt:'-1deg'},
   {id:'b',kind:'观察',title:'强者会被更强地放大',note:'领域知识、实验条件、判断力与长期记忆，会决定模型的能力落在哪里。',x:398,y:82,tilt:'1deg'},
   {id:'c',kind:'推断',title:'稀缺的是问题判断',note:'把模糊现象变成可检验、值得解决的问题，仍需要具体的人。',x:691,y:236,tilt:'-1.5deg'},
   {id:'d',kind:'问题',title:'我想成为怎样的人？',note:'不是与模型比赛写代码，而是能让模型在重要问题上变成放大器。',x:266,y:413,tilt:'1.5deg'},
   {id:'e',kind:'下一步',title:'找一个真实的反常现象',note:'从一个让我不服气的系统行为开始观察。',x:654,y:506,tilt:'-1deg'}],links:[['a','b'],['b','c'],['c','d'],['d','e']]};
  let state=JSON.parse(localStorage.getItem('caseboard-v1')||'null')||DEFAULT,selected=null,linking=null,drag=null,pan=null,scale=1,camera={x:0,y:0};
  state.boardColor ||= '#1b2738'; state.lineColor ||= '#d95650';
  state.cards.forEach(c=>c.cardScale ||= (c.kind==='问题'?'世界问题':c.kind==='推断'?'研究判断':(c.kind==='观察'||c.kind==='来源'||c.kind==='下一步')?'观察 / 证据':'机制 / 局部问题'));
  if(state.camera){scale=state.camera.scale||1;camera.x=state.camera.x||0;camera.y=state.camera.y||0}
  const board=document.querySelector('#board'),stage=document.querySelector('#stage'),boardWrap=document.querySelector('.board-wrap'),svg=document.querySelector('#strings'),inspector=document.querySelector('#inspector'),toast=document.querySelector('#toast');
  const app=document.querySelector('.app'),sidebar=document.querySelector('#sidebar'),inspectorContent=document.querySelector('#inspectorContent');
  const narrowScreen=window.matchMedia('(max-width:900px)');
  let leftOpen=narrowScreen.matches?false:state.panels?.left!==false,rightOpen=narrowScreen.matches?false:state.panels?.right!==false;
  function updatePanels(){
    sidebar.hidden=!leftOpen;inspector.hidden=!rightOpen;
    app.classList.toggle('left-collapsed',!leftOpen);app.classList.toggle('right-collapsed',!rightOpen);
    document.querySelector('#toggleSidebar').setAttribute('aria-expanded',String(leftOpen));
    document.querySelector('#toggleInspector').setAttribute('aria-expanded',String(rightOpen));
  }
  function setPanel(which,open){
    if(which==='left')leftOpen=open;else rightOpen=open;
    if(narrowScreen.matches&&open){if(which==='left')rightOpen=false;else leftOpen=false}
    updatePanels();save();
  }
  document.querySelector('#toggleSidebar').onclick=()=>setPanel('left',!leftOpen);
  document.querySelector('#toggleInspector').onclick=()=>setPanel('right',!rightOpen);
  document.querySelector('#closeSidebar').onclick=()=>{setPanel('left',false);document.querySelector('#toggleSidebar').focus()};
  document.querySelector('#closeInspector').onclick=()=>{setPanel('right',false);document.querySelector('#toggleInspector').focus()};
  narrowScreen.addEventListener('change',()=>{if(narrowScreen.matches){leftOpen=false;rightOpen=false}else{leftOpen=state.panels?.left!==false;rightOpen=state.panels?.right!==false}updatePanels()});
  updatePanels();
  const typeColor={线索:'#e5b55c',来源:'#77b7d5',观察:'#77b7d5',推断:'#c68bf1',问题:'#ff7168',下一步:'#ff7168'};
  const scaleClass={'世界问题':'world','研究判断':'research','机制 / 局部问题':'mechanism','观察 / 证据':'evidence'};
  window.addEventListener('resize',()=>drawLinks());
  const cardDimensions={world:[286,154],research:[228,123],mechanism:[185,104],evidence:[142,76]};
  const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function save(){state.panels={left:leftOpen,right:rightOpen};state.camera={x:camera.x,y:camera.y,scale};localStorage.setItem('caseboard-v1',JSON.stringify(state));document.querySelector('#caseTitle').textContent=state.caseTitle;document.querySelector('#count').textContent=`${state.cards.length} 张卡片`}
  function applyStyle(){boardWrap.style.backgroundColor=state.boardColor;boardWrap.style.backgroundPosition=`${camera.x}px ${camera.y}px`;document.querySelector('#boardColor').value=state.boardColor;document.querySelector('#lineColor').value=state.lineColor;stage.style.transform=`translate(${camera.x}px,${camera.y}px) scale(${scale})`;const wasFar=stage.classList.contains('far');stage.classList.toggle('far',scale<.55);if(wasFar!==(scale<.55))drawLinks();document.querySelector('#zoomLabel').textContent=Math.round(scale*100)+'%'}
  function markCards(){document.querySelectorAll('.card').forEach(e=>{e.classList.toggle('selected',e.dataset.id===selected);e.classList.toggle('target',e.dataset.id===linking)});boardWrap.classList.toggle('linking',!!linking);document.querySelector('#linkBtn').classList.toggle('active',!!linking)}
  function render(){board.querySelectorAll('.card').forEach(e=>e.remove());document.querySelector('#empty').hidden=state.cards.length>0;state.cards.forEach(c=>{let e=document.createElement('article');e.className=`card ${scaleClass[c.cardScale]||'mechanism'}`;e.dataset.id=c.id;e.style.cssText=`left:${c.x}px;top:${c.y}px;--tilt:${c.tilt||'0deg'};--type:${typeColor[c.kind]||'#e5b55c'}`;e.innerHTML=`<button class="pin" aria-label="从这张卡片连线" title="从这里连线">↗</button><div class="kind">${esc(c.cardScale)} · ${esc(c.kind)}</div><div class="title">${esc(c.title||'无标题')}</div><div class="excerpt">${esc(c.note||'')}</div>`;e.addEventListener('pointerdown',startDrag);e.addEventListener('click',clickCard);let pin=e.querySelector('.pin');pin.addEventListener('pointerdown',x=>x.stopPropagation());pin.addEventListener('click',x=>{x.stopPropagation();enterLinkMode(c.id)});board.appendChild(e)});drawLinks();markCards();applyStyle();save()}
  function drawLinks(){const sizes=new Map([...board.querySelectorAll('.card')].map(e=>[e.dataset.id,[e.offsetWidth,e.offsetHeight]]));svg.innerHTML='';state.links.forEach(([a,b])=>{let A=state.cards.find(c=>c.id===a),B=state.cards.find(c=>c.id===b);if(!A||!B)return;let [aw,ah]=sizes.get(a)||cardDimensions[scaleClass[A.cardScale]||'mechanism'],[bw,bh]=sizes.get(b)||cardDimensions[scaleClass[B.cardScale]||'mechanism'];let x1=A.x+aw/2,y1=A.y+ah/2,x2=B.x+bw/2,y2=B.y+bh/2;let l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('stroke',state.lineColor);l.setAttribute('stroke-width','2');l.setAttribute('opacity','.9');svg.appendChild(l);let p=document.createElementNS('http://www.w3.org/2000/svg','circle');p.setAttribute('cx',x1);p.setAttribute('cy',y1);p.setAttribute('r','3');p.setAttribute('fill',state.lineColor);svg.appendChild(p)})}
  function startDrag(e){let c=state.cards.find(x=>x.id===e.currentTarget.dataset.id),r=boardWrap.getBoundingClientRect();drag={c,dx:(e.clientX-r.left-camera.x)/scale-c.x,dy:(e.clientY-r.top-camera.y)/scale-c.y,startX:e.clientX,startY:e.clientY,moved:false,el:e.currentTarget};window.addEventListener('pointermove',moveDrag);window.addEventListener('pointerup',endDrag,{once:true})}
  function moveDrag(e){if(!drag)return;if(!drag.moved&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<6)return;let r=boardWrap.getBoundingClientRect();drag.moved=true;drag.c.x=(e.clientX-r.left-camera.x)/scale-drag.dx;drag.c.y=(e.clientY-r.top-camera.y)/scale-drag.dy;drag.el.style.left=drag.c.x+'px';drag.el.style.top=drag.c.y+'px';drawLinks()}
  function endDrag(){window.removeEventListener('pointermove',moveDrag);if(drag?.moved)save();if(drag)setTimeout(()=>drag=null,0)}
  function enterLinkMode(id){linking=id||'choose-source';markCards();toastMsg(id?'现在点另一张卡片，红线会自动钉上。':'先点起点，再点终点。')}
  function clearLinkMode(){linking=null;markCards()}
  function clickCard(e){if(drag?.moved)return;let id=e.currentTarget.dataset.id;if(linking==='choose-source'){selected=id;linking=id;markCards();openInspector();toastMsg('已选起点；再点一张卡片即可连线。');return}if(linking&&linking!==id){if(!state.links.some(x=>x[0]===linking&&x[1]===id))state.links.push([linking,id]);selected=id;clearLinkMode();drawLinks();save();openInspector();toastMsg('红线已钉上。');return}selected=id;markCards();openInspector()}
  function openInspector(){let c=state.cards.find(x=>x.id===selected);if(!c)return;setPanel('right',true);inspectorContent.innerHTML=`<h2>线索详情</h2>${linking?'<div class="connection-help">连线模式已开启：点另一张卡片即可自动建立关系。</div>':''}<div class="field"><label>思想尺度</label><select id="fscale">${['世界问题','研究判断','机制 / 局部问题','观察 / 证据'].map(x=>`<option ${x===c.cardScale?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>类型</label><select id="fkind">${['线索','来源','观察','推断','问题','下一步'].map(x=>`<option ${x===c.kind?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>标题</label><input id="ftitle" value="${esc(c.title)}" /></div><div class="field"><label>记录 / 证据 / 想法</label><textarea id="fnote">${esc(c.note)}</textarea></div><div class="actions"><button class="btn primary" id="saveCard">保存</button><button class="btn" id="makeLink">从这里连线</button><button class="btn" id="delCard">删除</button></div>`;document.querySelector('#saveCard').onclick=()=>{c.cardScale=document.querySelector('#fscale').value;c.kind=document.querySelector('#fkind').value;c.title=document.querySelector('#ftitle').value.trim()||'无标题';c.note=document.querySelector('#fnote').value.trim();render();openInspector();toastMsg('线索已归档。')};document.querySelector('#makeLink').onclick=()=>enterLinkMode(c.id);document.querySelector('#delCard').onclick=()=>{state.cards=state.cards.filter(x=>x.id!==c.id);state.links=state.links.filter(x=>x[0]!==c.id&&x[1]!==c.id);selected=null;clearLinkMode();setPanel('right',false);inspectorContent.innerHTML='<h2>放大一张卡片</h2><p class="empty-note">点一下线索卡，就可以记录它的来源、你的疑问，以及它和别的线索之间的关系。</p>';render()}}
  function startPan(e){if(e.target.closest('.card'))return;pan={x:e.clientX,y:e.clientY,cx:camera.x,cy:camera.y,moved:false};boardWrap.classList.add('panning');window.addEventListener('pointermove',movePan);window.addEventListener('pointerup',endPan,{once:true})}
  function movePan(e){if(!pan)return;pan.moved=true;camera.x=pan.cx+e.clientX-pan.x;camera.y=pan.cy+e.clientY-pan.y;applyStyle()}
  function endPan(){window.removeEventListener('pointermove',movePan);boardWrap.classList.remove('panning');if(pan){save();setTimeout(()=>pan=null,0)}}
  function setZoom(next,anchor){
    const r=boardWrap.getBoundingClientRect(),point=anchor||{x:r.width/2,y:r.height/2};
    const wx=(point.x-camera.x)/scale,wy=(point.y-camera.y)/scale;
    scale=Math.max(.35,Math.min(1.8,next));
    camera.x=point.x-wx*scale;camera.y=point.y-wy*scale;applyStyle();save();
  }
  function wheelZoom(e){
    e.preventDefault();
    if(drag||pan||!e.deltaY)return;
    const r=boardWrap.getBoundingClientRect();
    const unit=e.deltaMode===1?16:e.deltaMode===2?r.height:1;
    const delta=Math.max(-120,Math.min(120,e.deltaY*unit));
    setZoom(scale*Math.exp(-delta*.002),{x:e.clientX-r.left,y:e.clientY-r.top});
  }
  boardWrap.addEventListener('wheel',wheelZoom,{passive:false});
  function add(){let r=boardWrap.getBoundingClientRect(),c={id:crypto.randomUUID(),cardScale:'观察 / 证据',kind:'线索',title:'新线索',note:'它让我想到什么？证据是什么？',x:(r.width/2-camera.x)/scale-71,y:(r.height/2-camera.y)/scale-38,tilt:'0deg'};state.cards.push(c);selected=c.id;render();openInspector();document.querySelector('#ftitle').focus();document.querySelector('#ftitle').select()}
  function toastMsg(m){toast.textContent=m;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
  document.querySelector('#addBtn').onclick=add;document.querySelector('#linkBtn').onclick=()=>{if(linking){clearLinkMode();toastMsg('已退出连线模式。');return}enterLinkMode(selected)};document.querySelector('#zoomIn').onclick=()=>setZoom(Math.min(1.8,+(scale+.1).toFixed(2)));document.querySelector('#zoomOut').onclick=()=>setZoom(Math.max(.35,+(scale-.1).toFixed(2)));document.querySelector('#boardColor').oninput=e=>{state.boardColor=e.target.value;applyStyle();save()};document.querySelector('#lineColor').oninput=e=>{state.lineColor=e.target.value;drawLinks();save()};boardWrap.addEventListener('pointerdown',startPan);render();
  </script>
</body></html>
