<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111722" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <title>Caseboard — 推理工作台</title>
  <meta name="description" content="把线索、证据和推断放到同一张推理板上。" />
  <style>
    :root{--ink:#111722;--rail:#171f2d;--paper:#f7f1df;--paper2:#eee4ca;--muted:#8e98a9;--red:#e5534b;--red2:#ff7168;--line:#d5c7a7;--gold:#e5b55c;--font-sans:"Instrument Sans","PingFang SC","Hiragino Sans GB","Noto Sans SC",ui-sans-serif,system-ui,sans-serif;--font-serif:"Instrument Serif","Songti SC","Noto Serif SC",Georgia,serif}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:#eff2f7;font:15px/1.5 var(--font-sans);letter-spacing:-.01em;overflow:hidden;font-feature-settings:"ss01" on,"cv11" on}.app{height:100vh;display:grid;grid-template-columns:260px 1fr 315px}.side{background:var(--rail);border-right:1px solid #2b3545;padding:24px 18px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.02em}.brand-mark{width:31px;height:31px;border:2px solid var(--red2);border-radius:50%;display:grid;place-items:center;color:var(--red2);font-size:17px}.case-name{background:#202a3b;border:1px solid #344158;border-radius:11px;padding:13px}.case-name small,.section-title{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}.case-name strong{font-size:15px}.section-title{margin:0 0 8px}.legend{display:grid;gap:7px}.legend div{color:#cad0da;font-size:13px;display:flex;align-items:center;gap:9px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.dot.lead{background:var(--gold)}.dot.source{background:#77b7d5}.dot.idea{background:#c68bf1}.dot.question{background:var(--red2)}.scale-guide{color:#aeb8c8;font-size:12px;line-height:1.55;margin:0}.style-row{display:flex;align-items:center;justify-content:space-between;color:#cad0da;font-size:13px;margin:8px 0}.style-row input{width:34px;height:25px;padding:1px;border:1px solid #536074;border-radius:5px;background:transparent}.side-foot{margin-top:auto;color:var(--muted);font-size:12px}.workspace{min-width:0;display:grid;grid-template-rows:74px 1fr;background:radial-gradient(circle at 63% 35%,#253248 0,#151d2a 44%,#101722 100%)}.toolbar{display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid #2b3545}.toolbar h1{font-size:17px;margin:0 auto 0 0}.toolbar h1 span{color:var(--muted);font-size:12px;font-weight:500;margin-left:8px}.btn{border:1px solid #3b4658;background:#202a3a;color:#eff2f7;border-radius:8px;padding:9px 11px;font:inherit;cursor:pointer}.btn:hover{border-color:#71809a}.btn.primary{background:var(--red);border-color:var(--red);font-weight:700}.btn.active{outline:2px solid var(--gold);outline-offset:2px}.zoom{font-variant-numeric:tabular-nums;color:#c9d1dc;font-size:12px;min-width:42px;text-align:center}.board-wrap{position:relative;overflow:hidden;cursor:grab;background-image:linear-gradient(rgba(172,190,213,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(172,190,213,.10) 1px,transparent 1px);background-size:32px 32px}.board-wrap.panning{cursor:grabbing}.board-wrap.linking .card{cursor:crosshair}.stage{position:absolute;inset:0;transform-origin:0 0}.board{position:absolute;inset:0;overflow:visible}.strings{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:3}.card{position:absolute;width:185px;min-height:104px;background:var(--paper);color:#202630;border:1px solid var(--line);border-radius:4px;padding:13px 14px 12px;box-shadow:0 9px 18px rgba(0,0,0,.24);cursor:grab;transform:rotate(var(--tilt));user-select:none}.card.world{width:286px;min-height:154px;background:#fff6df;border-color:#d9b15e}.card.research{width:228px;min-height:123px;background:#f3e9ff;border-color:#bd8ee4}.card.mechanism{width:185px;min-height:104px}.card.evidence{width:142px;min-height:76px;padding:10px 11px;background:#e9f3f7;border-color:#8ebdd4}.card.evidence .title{font-size:13px}.card.evidence .excerpt{font-size:11px;-webkit-line-clamp:1}.card:active{cursor:grabbing}.card.selected{outline:3px solid var(--red2);outline-offset:3px}.card.target{outline:3px solid var(--gold);outline-offset:3px}.pin{position:absolute;z-index:2;left:50%;top:-14px;transform:translateX(-50%);width:28px;height:28px;border:0;border-radius:50%;background:var(--type);color:#fff;box-shadow:0 2px 5px #0006;cursor:pointer;font-size:15px;line-height:28px;padding:0}.pin:hover{transform:translateX(-50%) scale(1.12)}.card .kind{color:#6e7480;text-transform:uppercase;font-size:10px;letter-spacing:.1em;font-weight:800}.card .title{font-family:ui-serif,Georgia,serif;font-weight:700;font-size:16px;line-height:1.23;margin:5px 0}.card .excerpt{font-size:12px;color:#555e68;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.stage.far .card{min-height:16px!important;width:16px!important;height:16px!important;padding:0;border-radius:50%;box-shadow:0 2px 8px #0006}.stage.far .card>*{display:none}.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#8d9aad;text-align:center}.inspector{background:#f4f5f8;color:#202630;padding:22px 20px;border-left:1px solid #ccd2dc;overflow:auto}.inspector h2{font-size:18px;margin:3px 0 16px}.empty-note{color:#707b89;font-size:14px;line-height:1.6}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:11px;font-weight:800;color:#687384;letter-spacing:.08em;text-transform:uppercase}.field input,.field textarea,.field select{width:100%;border:1px solid #ccd3dd;border-radius:7px;padding:9px;background:white;color:#202630;font:inherit}.field textarea{resize:vertical;min-height:96px}.inspector .btn{color:#202630;background:#fff;border-color:#c4ccd8}.inspector .btn.primary{color:#fff;background:var(--red);border-color:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.connection-help{background:#fff4d8;border:1px solid #f0d28e;border-radius:8px;padding:9px 10px;color:#714f10;font-size:13px;margin:12px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);background:#eef2f8;color:#172030;padding:10px 14px;border-radius:8px;box-shadow:0 8px 25px #0005;transition:.25s;z-index:5}.toast.show{transform:translateX(-50%) translateY(0)}@media(max-width:900px){.app{grid-template-columns:0 1fr}.side{display:none}.inspector{position:fixed;z-index:4;right:0;top:0;bottom:0;width:min(315px,88vw);transform:translateX(100%);transition:.25s;box-shadow:-5px 0 25px #0004}.inspector.open{transform:none}.toolbar{padding:0 14px}.toolbar h1 span{display:none}.btn{padding:8px}.card{width:172px}}
    .app{--left-width:260px;--right-width:315px;grid-template-columns:var(--left-width) minmax(0,1fr) var(--right-width)}
    .app.left-collapsed{--left-width:0px}.app.right-collapsed{--right-width:0px}
    .side{grid-column:1;grid-row:1;min-height:0;overflow:auto}.workspace{grid-column:2;grid-row:1;min-height:0;grid-template-rows:auto minmax(0,1fr)}
    .inspector{grid-column:3;grid-row:1;min-height:0}.side[hidden]{display:none!important}
    .toolbar{min-height:74px;flex-wrap:wrap;padding:12px 16px;gap:8px}.toolbar .btn{white-space:nowrap}
    .panel-close{align-self:flex-end;font-size:12px;padding:5px 9px}.inspector>.panel-close{display:block;margin:0 0 14px auto}
    .btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
    @media(max-width:900px){
      .app{grid-template-columns:0 minmax(0,1fr) 0}
      .side{position:fixed;z-index:4;top:0;bottom:0;left:0;width:min(315px,88vw);display:flex;box-shadow:0 0 25px #0004}
      .toolbar h1{font-size:15px}
    }
    .board-select{max-width:210px;min-width:90px;text-overflow:ellipsis}
    .board-wrap:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
    #storageError{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:12px;background:#8e2525;color:white}
    .strings line.link-hit{stroke:transparent;cursor:pointer;pointer-events:stroke}
    .strings line.link-hit:hover+line,.strings line.sel{filter:drop-shadow(0 0 3px var(--gold))}
    .style-row input[type=range]{width:120px;height:20px}
    .range-row{align-items:center}.range-row output{color:#cad0da;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
    .swatches{display:flex;flex-wrap:wrap;gap:7px}.swatch{width:22px;height:22px;border-radius:50%;border:2px solid #2b3545;cursor:pointer;padding:0;background:var(--c)}.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}.inspector .swatch{border-color:#ccd3dd}.inspector .swatch.on{border-color:#202630;box-shadow:0 0 0 2px var(--gold)}
    @media(max-width:600px){.board-select{max-width:150px}}

    /* —— 福尔摩斯式推理墙：软木板 + 剪报 + 图钉 —— */
    .workspace{background:
      radial-gradient(ellipse at 30% 20%,#3a2a1c 0%,transparent 55%),
      radial-gradient(ellipse at 80% 70%,#1a120c 0%,transparent 50%),
      linear-gradient(160deg,#2a1f16,#14100c 70%)}
    .toolbar{background:linear-gradient(#2c2218,#221a13);border-bottom:1px solid #4a3828;box-shadow:0 2px 10px #0006}
    .board-wrap{
      background-color:#6a4a32;
      background-image:
        radial-gradient(circle at 10% 12%,rgba(255,220,170,.35) 0 1.2px,transparent 2px),
        radial-gradient(circle at 42% 38%,rgba(30,15,5,.35) 0 1.4px,transparent 2.2px),
        radial-gradient(circle at 78% 22%,rgba(255,210,150,.28) 0 1.1px,transparent 2px),
        radial-gradient(circle at 22% 68%,rgba(0,0,0,.28) 0 1.3px,transparent 2.1px),
        radial-gradient(circle at 88% 72%,rgba(255,230,190,.25) 0 1px,transparent 1.8px),
        radial-gradient(circle at 55% 8%,rgba(60,30,10,.3) 0 1.2px,transparent 2px),
        radial-gradient(circle at 33% 88%,rgba(255,200,140,.2) 0 1.5px,transparent 2.4px),
        radial-gradient(circle at 70% 55%,rgba(0,0,0,.22) 0 1px,transparent 1.8px),
        linear-gradient(125deg,rgba(255,255,255,.08),transparent 40%,rgba(0,0,0,.18)),
        repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(0,0,0,.07) 28px),
        repeating-linear-gradient(90deg,transparent,transparent 27px,rgba(0,0,0,.07) 28px);
      background-size:28px 26px,24px 22px,32px 30px,22px 24px,26px 20px,30px 28px,34px 32px,20px 18px,100% 100%,28px 28px,28px 28px;
      box-shadow:inset 0 0 100px rgba(0,0,0,.45),inset 0 0 0 2px rgba(40,25,12,.4)
    }
    .strings line:not(.link-hit){filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
    .card{
      border:0;border-radius:1px;
      background:
        linear-gradient(180deg,rgba(255,255,255,.28),transparent 28%),
        repeating-linear-gradient(0deg,transparent,transparent 17px,rgba(40,50,70,.055) 18px),
        var(--paper);
      box-shadow:
        1px 2px 0 rgba(0,0,0,.06),
        3px 8px 10px rgba(0,0,0,.22),
        8px 18px 28px rgba(0,0,0,.28),
        0 0 0 1px rgba(90,70,40,.18);
      filter:drop-shadow(0 1px 0 rgba(255,255,255,.15))
    }
    .card::before{
      content:"";position:absolute;z-index:1;top:-7px;left:14%;width:46px;height:15px;
      background:linear-gradient(180deg,rgba(255,252,235,.55),rgba(240,230,190,.35));
      border:1px solid rgba(120,100,60,.12);transform:rotate(-3deg);
      box-shadow:0 1px 2px rgba(0,0,0,.12);pointer-events:none
    }
    .card::after{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:
        radial-gradient(ellipse at 8% 92%,rgba(120,90,40,.08),transparent 40%),
        radial-gradient(ellipse at 95% 8%,rgba(80,60,30,.06),transparent 35%);
      box-shadow:inset 0 0 24px rgba(90,70,40,.06)
    }
    .card.world{
      background:
        linear-gradient(180deg,rgba(255,255,255,.22),transparent 22%),
        repeating-linear-gradient(0deg,transparent,transparent 16px,rgba(90,70,30,.06) 17px),
        #f6ebc8;
      box-shadow:1px 2px 0 rgba(0,0,0,.06),4px 10px 14px rgba(0,0,0,.24),10px 22px 32px rgba(0,0,0,.3),0 0 0 1px rgba(150,110,40,.28)
    }
    .card.research{
      background:
        linear-gradient(180deg,rgba(255,255,255,.25),transparent 22%),
        repeating-linear-gradient(0deg,transparent,transparent 17px,rgba(70,40,100,.05) 18px),
        #efe4f6
    }
    .card.mechanism{
      background:
        linear-gradient(180deg,rgba(255,255,255,.3),transparent 24%),
        repeating-linear-gradient(0deg,transparent,transparent 17px,rgba(40,50,70,.05) 18px),
        #f3e8cf
    }
    .card.evidence{
      background:
        linear-gradient(180deg,rgba(255,255,255,.35),transparent 30%),
        #e8eef2;
      box-shadow:0 1px 0 #fff,2px 3px 0 rgba(0,0,0,.08),4px 10px 16px rgba(0,0,0,.28),0 0 0 6px #f7f3ea,0 0 0 7px rgba(0,0,0,.12)
    }
    .card.selected{outline:2px solid var(--red2);outline-offset:5px;box-shadow:1px 2px 0 rgba(0,0,0,.06),3px 8px 10px rgba(0,0,0,.22),0 0 0 1px rgba(90,70,40,.18),0 0 0 6px rgba(229,83,75,.18)}
    .card.target{outline:2px solid var(--gold);outline-offset:5px}
    .card .kind{font-family:var(--font-sans);color:#7a6550;letter-spacing:.12em;font-size:9px;font-weight:600;opacity:.9;text-transform:uppercase}
    .card .title{font-family:var(--font-serif);font-weight:400;font-size:17px;line-height:1.25;margin:6px 0 4px;color:#1c1812;letter-spacing:-.015em;text-shadow:0 1px 0 rgba(255,255,255,.35)}
    .card .excerpt{font-family:var(--font-sans);font-size:12px;color:#4a4338;line-height:1.45;font-weight:400}
    .card.evidence .title{font-size:13px;font-family:var(--font-serif)}
    .card.evidence .excerpt{font-family:var(--font-sans);font-size:10px}
    .card.link{
      width:210px;min-height:176px;padding:0 0 11px;overflow:hidden;
      background:#f4ead2;
      box-shadow:2px 3px 0 rgba(0,0,0,.08),6px 14px 20px rgba(0,0,0,.32),12px 28px 40px rgba(0,0,0,.28),0 0 0 1px rgba(90,70,40,.25)
    }
    .card.link .kind,.card.link .title,.card.link .excerpt,.card.link .link-meta{padding-left:12px;padding-right:12px}
    .card.link .kind{padding-top:8px}
    .card.link .link-shot-wrap{
      position:relative;height:108px;margin:0;background:
        linear-gradient(135deg,#2c2218,#4a3828);
      border-bottom:1px solid rgba(90,70,40,.25);overflow:hidden
    }
    .card.link .link-shot{width:100%;height:100%;object-fit:cover;display:block;background:#2a2018}
    .card.link .link-shot.fallback{object-fit:contain;padding:22px;background:
      radial-gradient(circle at 40% 35%,#5a4634,#2a2018)}
    .card.link .link-meta{display:flex;align-items:center;gap:7px;margin-top:2px;font-size:11px;color:#6a5a48}
    .card.link .link-meta img{width:14px;height:14px;border-radius:3px;flex:none}
    .card.link .title{font-size:14px;margin:4px 0 2px}
    .card.link .excerpt{-webkit-line-clamp:2}
    .pin{
      left:50%;top:-12px;width:22px;height:22px;border-radius:50%;font-size:0;line-height:0;color:transparent;z-index:4;
      background:
        radial-gradient(circle at 30% 26%,rgba(255,255,255,.95) 0 14%,transparent 38%),
        radial-gradient(circle at 50% 58%,var(--type),#1a120c);
      box-shadow:
        0 1px 0 rgba(255,255,255,.55) inset,
        0 2px 4px rgba(0,0,0,.55),
        0 7px 10px rgba(0,0,0,.35),
        0 12px 2px -5px rgba(0,0,0,.4);
      border:1px solid rgba(0,0,0,.28)
    }
    .pin::after{
      content:"";position:absolute;left:50%;top:86%;width:2.5px;height:13px;
      background:linear-gradient(#d8dbe0,#6e737a 65%,#2a2d32);transform:translateX(-50%);
      border-radius:1px;box-shadow:0 1px 2px rgba(0,0,0,.45);pointer-events:none
    }
    .pin:hover{transform:translateX(-50%) scale(1.14)}
    .hint{font-size:12px;color:#8a7a66;line-height:1.45;margin:0}
    .stage.far .card{
      min-height:14px!important;width:14px!important;height:14px!important;padding:0;border-radius:50%;
      background:var(--type)!important;filter:none;
      box-shadow:0 2px 6px #0008,0 0 0 2px rgba(255,255,255,.2)!important
    }
    .stage.far .card::before,.stage.far .card::after{display:none}
    .empty{color:#d9c4a4;text-shadow:0 1px 2px #0008;font-family:var(--font-serif);font-size:16px;letter-spacing:-.01em}
    .side{background:linear-gradient(180deg,#1c1612,#14100e);border-right:1px solid #3a2c20}
    .case-name{background:#241c16;border-color:#4a3828}
    .btn{background:#2a211a;border-color:#4a3a2c}.btn:hover{border-color:#8a7058}.btn.primary{background:#b33b34;border-color:#b33b34}
    .inspector{background:#f3ead7;border-left:1px solid #d2c2a4;color:#241c14}
    .inspector h2{font-family:var(--font-serif);font-weight:400;font-size:22px;letter-spacing:-.02em;line-height:1.2}
    .brand{font-family:var(--font-serif);font-weight:400;letter-spacing:-.02em}
    .toolbar h1{font-family:var(--font-serif);font-weight:400;letter-spacing:-.02em}
    .empty-note{color:#6a5c4c}.field label{color:#7a6a55}
    .field input,.field textarea,.field select{background:#fffaf0;border-color:#d2c2a4;color:#241c14}
    .inspector .btn{background:#fffaf0;border-color:#cbb89a;color:#241c14}
    .hint{font-size:12px;color:#7a6a55;line-height:1.45;margin:0 0 8px}

    /* 详情面板滑入 + 内容弹出 */
    @property --right-width{syntax:'<length>';inherits:true;initial-value:315px}
    @property --left-width{syntax:'<length>';inherits:true;initial-value:260px}
    .app{transition:--right-width .42s cubic-bezier(.22,1,.36,1),--left-width .42s cubic-bezier(.22,1,.36,1),grid-template-columns .42s cubic-bezier(.22,1,.36,1)}
    .inspector{
      overflow:auto;min-width:0;
      transition:opacity .28s ease,transform .42s cubic-bezier(.22,1,.36,1),box-shadow .42s ease,border-color .3s;
      transform:translateX(0);opacity:1
    }
    .app.right-collapsed .inspector{
      opacity:0;transform:translateX(28px);pointer-events:none;border-color:transparent;overflow:hidden
    }
    #inspectorContent.content-pop{animation:inspectorPop .38s cubic-bezier(.22,1,.36,1) both}
    @keyframes inspectorPop{
      from{opacity:0;transform:translateY(14px) scale(.97)}
      to{opacity:1;transform:none}
    }
    @media(max-width:900px){
      .inspector{
        position:fixed;z-index:5;top:0;right:0;bottom:0;width:min(315px,88vw);
        transform:translateX(100%);opacity:1;box-shadow:-10px 0 36px rgba(0,0,0,.4);
        transition:transform .42s cubic-bezier(.22,1,.36,1)
      }
      .app:not(.right-collapsed) .inspector{transform:translateX(0);pointer-events:auto}
      .app.right-collapsed .inspector{transform:translateX(110%);opacity:1;pointer-events:none}
    }
    @media(prefers-reduced-motion:reduce){
      .app,.inspector,#inspectorContent.content-pop{transition:none!important;animation:none!important}
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="side" id="sidebar"><button class="btn panel-close" id="closeSidebar" aria-label="收起案件侧栏">收起 ‹</button><div class="brand"><span class="brand-mark">⌕</span> Caseboard</div><div class="case-name"><small>当前案件</small><strong id="caseTitle">关于“AI 与人的位置”</strong></div><section><p class="section-title">线索类型</p><div class="legend"><div><i class="dot lead"></i>线索</div><div><i class="dot source"></i>来源</div><div><i class="dot idea"></i>推断</div><div><i class="dot question"></i>待问问题</div><div><i class="dot" style="background:#5a9f78"></i>链接</div></div></section><section><p class="section-title">案件风格</p><label class="style-row">板面颜色 <input type="color" id="boardColor" value="#6a4a32"></label><label class="style-row">连线颜色</label><div class="swatches" id="lineColorSwatches" role="group" aria-label="连线默认颜色"></div><label class="style-row range-row">连线粗细 <span style="display:flex;align-items:center;gap:6px"><input type="range" id="lineWidth" min="1" max="10" value="2"><output id="lineWidthVal">2</output></span></label></section><div class="side-foot">画布上粘贴网址可加入链接剪报；粘贴其他文字可新建板子。<br>所有板子保存在这台设备上。<br>你不是在收集答案，而是在留下推理的轨迹。</div></aside>
    <section class="workspace"><header class="toolbar"><button class="btn" id="toggleSidebar" aria-controls="sidebar" aria-expanded="true">案件</button><h1>推理板 <span id="count"></span></h1><select class="btn board-select" id="boardSelect" aria-label="切换板子"></select><button class="btn" id="newBoard">＋ 板子</button><button class="btn" id="zoomOut" aria-label="缩小">－</button><span class="zoom" id="zoomLabel">100%</span><button class="btn" id="zoomIn" aria-label="放大">＋</button><button class="btn" id="linkBtn">连线</button><button class="btn" id="addLinkBtn">＋ 链接</button><button class="btn primary" id="addBtn">＋ 新线索</button><button class="btn" id="toggleInspector" aria-controls="inspector" aria-expanded="true">详情</button></header><div class="board-wrap" tabindex="0" aria-label="推理画布，粘贴文字可新建板子"><div class="stage" id="stage"><div class="board" id="board"><svg class="strings" id="strings"></svg><div class="empty" id="empty" hidden>在画布上粘贴网址钉上链接剪报<br>或粘贴文字新建板子。</div></div></div></div></section>
    <aside class="inspector" id="inspector"><button class="btn panel-close" id="closeInspector" aria-label="收起详情侧栏">收起 ›</button><div id="inspectorContent"><h2>放大一张卡片</h2><p class="empty-note">点线索卡可编辑；粘贴网址或点「＋ 链接」可钉上带预览的链接剪报并写批注；点连线可改颜色、标志或删除。</p></div></aside>
  </main><div class="toast" id="toast" role="status"></div><div id="storageError" role="alert" hidden></div>
  <script src="board-store.js"></script>
  <script>
  const DEFAULT={caseTitle:'关于“AI 与人的位置”',cards:[
   {id:'a',kind:'线索',title:'AI 让“会做”变得廉价',note:'模型能很快生成代码、总结、推导。但这不等于问题已经被解决。',x:94,y:116,tilt:'-1deg'},
   {id:'b',kind:'观察',title:'强者会被更强地放大',note:'领域知识、实验条件、判断力与长期记忆，会决定模型的能力落在哪里。',x:398,y:82,tilt:'1deg'},
   {id:'c',kind:'推断',title:'稀缺的是问题判断',note:'把模糊现象变成可检验、值得解决的问题，仍需要具体的人。',x:691,y:236,tilt:'-1.5deg'},
   {id:'d',kind:'问题',title:'我想成为怎样的人？',note:'不是与模型比赛写代码，而是能让模型在重要问题上变成放大器。',x:266,y:413,tilt:'1.5deg'},
   {id:'e',kind:'下一步',title:'找一个真实的反常现象',note:'从一个让我不服气的系统行为开始观察。',x:654,y:506,tilt:'-1deg'}],links:[['a','b'],['b','c'],['c','d'],['d','e']]};
  const workspace=CaseboardStore.load(localStorage,DEFAULT);
  let state=workspace.boards.find(b=>b.id===workspace.activeId).data,selected=null,selectedLink=null,linking=null,drag=null,pan=null,scale=1,camera={x:0,y:0};
  if(state.boardColor==='#1b2738')state.boardColor='#6a4a32';
  state.boardColor ||= '#6a4a32'; state.lineColor ||= '#d95650'; state.lineWidth ||= 2; normalizeLinks(state);
  state.cards.forEach(c=>c.cardScale ||= (c.kind==='问题'?'世界问题':c.kind==='推断'?'研究判断':(c.kind==='观察'||c.kind==='来源'||c.kind==='下一步')?'观察 / 证据':'机制 / 局部问题'));
  if(state.camera){scale=state.camera.scale||1;camera.x=state.camera.x||0;camera.y=state.camera.y||0}
  const board=document.querySelector('#board'),stage=document.querySelector('#stage'),boardWrap=document.querySelector('.board-wrap'),svg=document.querySelector('#strings'),inspector=document.querySelector('#inspector'),toast=document.querySelector('#toast');
  const app=document.querySelector('.app'),sidebar=document.querySelector('#sidebar'),inspectorContent=document.querySelector('#inspectorContent');
  const narrowScreen=window.matchMedia('(max-width:900px)');
  let leftOpen=narrowScreen.matches?false:state.panels?.left!==false,rightOpen=narrowScreen.matches?false:state.panels?.right!==false;
  function updatePanels(){
    sidebar.hidden=!leftOpen;
    inspector.removeAttribute('hidden');
    inspector.setAttribute('aria-hidden',String(!rightOpen));
    app.classList.toggle('left-collapsed',!leftOpen);app.classList.toggle('right-collapsed',!rightOpen);
    document.querySelector('#toggleSidebar').setAttribute('aria-expanded',String(leftOpen));
    document.querySelector('#toggleInspector').setAttribute('aria-expanded',String(rightOpen));
  }
  function animInspectorContent(){
    if(window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
    inspectorContent.classList.remove('content-pop');
    void inspectorContent.offsetWidth;
    inspectorContent.classList.add('content-pop');
  }
  function setPanel(which,open){
    if(which==='left')leftOpen=open;else rightOpen=open;
    if(narrowScreen.matches&&open){if(which==='left')rightOpen=false;else leftOpen=false}
    updatePanels();save();
  }
  document.querySelector('#toggleSidebar').onclick=()=>setPanel('left',!leftOpen);
  document.querySelector('#toggleInspector').onclick=()=>setPanel('right',!rightOpen);
  document.querySelector('#closeSidebar').onclick=()=>{setPanel('left',false);document.querySelector('#toggleSidebar').focus()};
  document.querySelector('#closeInspector').onclick=()=>{setPanel('right',false);document.querySelector('#toggleInspector').focus()};
  narrowScreen.addEventListener('change',()=>{if(narrowScreen.matches){leftOpen=false;rightOpen=false}else{leftOpen=state.panels?.left!==false;rightOpen=state.panels?.right!==false}updatePanels()});
  updatePanels();
  const typeColor={线索:'#e5b55c',来源:'#77b7d5',观察:'#77b7d5',推断:'#c68bf1',问题:'#ff7168',下一步:'#ff7168',链接:'#5a9f78'};
  const scaleClass={'世界问题':'world','研究判断':'research','机制 / 局部问题':'mechanism','观察 / 证据':'evidence'};
  window.addEventListener('resize',()=>drawLinks());
  const cardDimensions={world:[286,154],research:[228,123],mechanism:[185,104],evidence:[142,76],link:[210,176]};
  const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const MARKERS=[['none','无'],['arrow','箭头'],['dot','圆点'],['diamond','菱形'],['bar','短杠']];
  const LINK_COLORS=[
    ['#d95650','红'],['#e5b55c','金'],['#77b7d5','蓝'],['#c68bf1','紫'],
    ['#5ecf8e','绿'],['#ff8a5b','橙'],['#f0e6d2','米'],['#8e98a9','灰']
  ];
  function normalizeLinks(s){if(!Array.isArray(s.links))s.links=[];s.links=s.links.map(l=>Array.isArray(l)?{from:l[0],to:l[1],marker:'arrow'}:l)}
  function tryParseUrl(text){
    const s=String(text||'').trim();if(!s||/\s/.test(s))return null;
    try{const u=new URL(/^https?:\/\//i.test(s)?s:'https://'+s);if(!/^https?:$/i.test(u.protocol)||!u.hostname.includes('.'))return null;return u.href}catch{return null}
  }
  function hostOf(url){try{return new URL(url).hostname.replace(/^www\./,'')}catch{return ''}}
  function faviconOf(url){const h=hostOf(url);return h?`https://www.google.com/s2/favicons?domain=${encodeURIComponent(h)}&sz=128`:''}
  function shotOf(url){return `https://image.thum.io/get/width/480/crop/270/noanimate/${url}`}
  function isLinkCard(c){return !!(c&&(c.url||c.kind==='链接'))}
  function cardFaceHtml(c){
    if(!isLinkCard(c))return `<div class="kind">${esc(c.cardScale)} · ${esc(c.kind)}</div><div class="title">${esc(c.title||'无标题')}</div><div class="excerpt">${esc(c.note||'')}</div>`;
    const url=c.url||'',host=hostOf(url)||'未填写网址',fav=faviconOf(url),shot=c.preview||(url?shotOf(url):'');
    const img=shot?`<div class="link-shot-wrap"><img class="link-shot" src="${esc(shot)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${esc(fav||'')}';this.classList.add('fallback')"/></div>`:`<div class="link-shot-wrap"><img class="link-shot fallback" src="${esc(fav)}" alt=""/></div>`;
    return `${img}<div class="kind">链接剪报 · ${esc(c.kind||'链接')}</div><div class="link-meta">${fav?`<img src="${esc(fav)}" alt=""/>`:''}<span>${esc(host)}</span></div><div class="title">${esc(c.title||host||'网页链接')}</div><div class="excerpt">${esc(c.note||'写一句批注…')}</div>`;
  }
  function markerDefs(color,prefix='mk'){return (
    `<marker id="${prefix}-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${color}"/></marker>`+
    `<marker id="${prefix}-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"><circle cx="5" cy="5" r="4.5" fill="${color}"/></marker>`+
    `<marker id="${prefix}-diamond" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M5,0L10,5L5,10L0,5z" fill="${color}"/></marker>`+
    `<marker id="${prefix}-bar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><rect x="3.5" y="0" width="3" height="10" fill="${color}"/></marker>`
  )}
  function colorKey(c){return String(c||'').replace('#','').toLowerCase()}
  function swatchHtml(active,name){
    return LINK_COLORS.map(([c,label])=>`<button type="button" class="swatch${colorKey(c)===colorKey(active)?' on':''}" data-color="${c}" data-swatch="${name}" style="--c:${c}" title="${label}" aria-label="${label}" aria-pressed="${colorKey(c)===colorKey(active)}"></button>`).join('')
  }
  function bindSwatches(root,get,set){
    root.querySelectorAll('.swatch').forEach(btn=>btn.onclick=()=>{set(btn.dataset.color);root.querySelectorAll('.swatch').forEach(b=>{const on=b.dataset.color===btn.dataset.color;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on))})})
  }
  // 从卡片中心朝目标方向，落到矩形边缘外 pad 像素处，避免标志被卡片盖住
  function edgePoint(cx,cy,w,h,tx,ty,pad){
    const dx=tx-cx,dy=ty-cy;if(!dx&&!dy)return {x:cx,y:cy};
    const hx=w/2,hy=h/2,sx=dx?hx/Math.abs(dx):Infinity,sy=dy?hy/Math.abs(dy):Infinity;
    const t=Math.min(sx,sy);let x=cx+dx*t,y=cy+dy*t;
    const len=Math.hypot(dx,dy);x-=dx/len*pad;y-=dy/len*pad;
    return {x,y};
  }
  function save(){state.panels={left:leftOpen,right:rightOpen};state.camera={x:camera.x,y:camera.y,scale};try{CaseboardStore.save(localStorage,workspace);document.querySelector('#storageError').hidden=true}catch(error){document.querySelector('#storageError').hidden=false;document.querySelector('#storageError').textContent='本地保存失败，可能是存储空间已满。请保留当前页面，勿刷新或关闭。'}document.querySelector('#caseTitle').textContent=state.caseTitle;document.querySelector('#count').textContent=`${state.cards.length} 张卡片`}
  function applyStyle(){boardWrap.style.backgroundColor=state.boardColor;boardWrap.style.backgroundPosition=`${camera.x}px ${camera.y}px`;document.querySelector('#boardColor').value=state.boardColor;document.querySelector('#lineWidth').value=state.lineWidth;document.querySelector('#lineWidthVal').textContent=state.lineWidth;stage.style.transform=`translate(${camera.x}px,${camera.y}px) scale(${scale})`;const wasFar=stage.classList.contains('far');stage.classList.toggle('far',scale<.55);if(wasFar!==(scale<.55))drawLinks();document.querySelector('#zoomLabel').textContent=Math.round(scale*100)+'%'}
  function refreshLineColorSwatches(){
    const box=document.querySelector('#lineColorSwatches');if(!box)return;
    box.innerHTML=swatchHtml(state.lineColor,'default');
    bindSwatches(box,()=>state.lineColor,c=>{state.lineColor=c;drawLinks();save()});
  }
  function markCards(){document.querySelectorAll('.card').forEach(e=>{e.classList.toggle('selected',e.dataset.id===selected);e.classList.toggle('target',e.dataset.id===linking)});boardWrap.classList.toggle('linking',!!linking);document.querySelector('#linkBtn').classList.toggle('active',!!linking)}
  function render(){board.querySelectorAll('.card').forEach(e=>e.remove());document.querySelector('#empty').hidden=state.cards.length>0;state.cards.forEach(c=>{let e=document.createElement('article');const link=isLinkCard(c);e.className=`card ${link?'link':(scaleClass[c.cardScale]||'mechanism')}`;e.dataset.id=c.id;e.style.cssText=`left:${c.x}px;top:${c.y}px;--tilt:${c.tilt||'0deg'};--type:${typeColor[c.kind]||(link?'#5a9f78':'#e5b55c')}`;e.innerHTML=`<button class="pin" aria-label="从这张卡片连线" title="从这里连线"></button>${cardFaceHtml(c)}`;e.addEventListener('pointerdown',startDrag);e.addEventListener('click',clickCard);let pin=e.querySelector('.pin');pin.addEventListener('pointerdown',x=>x.stopPropagation());pin.addEventListener('click',x=>{x.stopPropagation();enterLinkMode(c.id)});board.appendChild(e)});drawLinks();markCards();applyStyle();refreshLineColorSwatches();save()}
  function drawLinks(){
    const sizes=new Map([...board.querySelectorAll('.card')].map(e=>[e.dataset.id,[e.offsetWidth,e.offsetHeight]]));
    const used=new Set([state.lineColor,...state.links.map(lk=>lk.color||state.lineColor)]);
    let out='<defs>'+[...used].map(c=>markerDefs(c,'mk'+colorKey(c))).join('')+'</defs>';
    state.links.forEach((lk,i)=>{
      const A=state.cards.find(c=>c.id===lk.from),B=state.cards.find(c=>c.id===lk.to);if(!A||!B)return;
      const [aw,ah]=sizes.get(lk.from)||cardDimensions[isLinkCard(A)?'link':(scaleClass[A.cardScale]||'mechanism')];
      const [bw,bh]=sizes.get(lk.to)||cardDimensions[isLinkCard(B)?'link':(scaleClass[B.cardScale]||'mechanism')];
      const acx=A.x+aw/2,acy=A.y+ah/2,bcx=B.x+bw/2,bcy=B.y+bh/2;
      const pad=lk.marker&&lk.marker!=='none'?10:4;
      const p1=edgePoint(acx,acy,aw,ah,bcx,bcy,4),p2=edgePoint(bcx,bcy,bw,bh,acx,acy,pad);
      const w=lk.width||state.lineWidth||2,sel=i===selectedLink,stroke=lk.color||state.lineColor;
      const prefix='mk'+colorKey(stroke);
      const mk=(lk.marker&&lk.marker!=='none')?` marker-end="url(#${prefix}-${lk.marker})"`:'';
      out+=`<line class="link-hit" data-i="${i}" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke-width="${Math.max(16,w+12)}"/>`;
      out+=`<line class="${sel?'sel':''}" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${stroke}" stroke-width="${w}" opacity="${sel?1:.9}"${mk}/>`;
    });
    svg.innerHTML=out;
    svg.querySelectorAll('.link-hit').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();selectLink(+el.dataset.i)}));
  }
  function startDrag(e){let c=state.cards.find(x=>x.id===e.currentTarget.dataset.id),r=boardWrap.getBoundingClientRect();drag={c,dx:(e.clientX-r.left-camera.x)/scale-c.x,dy:(e.clientY-r.top-camera.y)/scale-c.y,startX:e.clientX,startY:e.clientY,moved:false,el:e.currentTarget};window.addEventListener('pointermove',moveDrag);window.addEventListener('pointerup',endDrag,{once:true})}
  function moveDrag(e){if(!drag)return;if(!drag.moved&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<6)return;let r=boardWrap.getBoundingClientRect();drag.moved=true;drag.c.x=(e.clientX-r.left-camera.x)/scale-drag.dx;drag.c.y=(e.clientY-r.top-camera.y)/scale-drag.dy;drag.el.style.left=drag.c.x+'px';drag.el.style.top=drag.c.y+'px';drawLinks()}
  function endDrag(){window.removeEventListener('pointermove',moveDrag);if(drag?.moved)save();if(drag)setTimeout(()=>drag=null,0)}
  function enterLinkMode(id){linking=id||'choose-source';markCards();toastMsg(id?'现在点另一张卡片，红线会自动钉上。':'先点起点，再点终点。')}
  function clearLinkMode(){linking=null;markCards()}
  function clickCard(e){if(drag?.moved)return;if(selectedLink!=null){selectedLink=null;drawLinks()}let id=e.currentTarget.dataset.id;if(linking==='choose-source'){selected=id;linking=id;markCards();openInspector();toastMsg('已选起点；再点一张卡片即可连线。');return}if(linking&&linking!==id){if(!state.links.some(x=>x.from===linking&&x.to===id))state.links.push({from:linking,to:id,marker:'none',width:state.lineWidth,color:state.lineColor});selected=id;clearLinkMode();drawLinks();save();openInspector();toastMsg('红线已钉上。');return}selected=id;markCards();openInspector()}
  function openInspector(){
    let c=state.cards.find(x=>x.id===selected);if(!c)return;setPanel('right',true);
    const kinds=['线索','链接','来源','观察','推断','问题','下一步'];
    inspectorContent.innerHTML=`<h2>${isLinkCard(c)?'链接剪报':'线索详情'}</h2>${linking?'<div class="connection-help">连线模式已开启：点另一张卡片即可自动建立关系。</div>':''}`+
      `<div class="field"><label>思想尺度</label><select id="fscale">${['世界问题','研究判断','机制 / 局部问题','观察 / 证据'].map(x=>`<option ${x===c.cardScale?'selected':''}>${x}</option>`).join('')}</select></div>`+
      `<div class="field"><label>类型</label><select id="fkind">${kinds.map(x=>`<option ${x===c.kind?'selected':''}>${x}</option>`).join('')}</select></div>`+
      `<div class="field"><label>标题</label><input id="ftitle" value="${esc(c.title||'')}" /></div>`+
      `<div class="field"><label>网址</label><input id="furl" type="url" placeholder="https://…" value="${esc(c.url||'')}" /></div>`+
      `<div class="field"><label>预览图 URL（可选）</label><input id="fpreview" type="url" placeholder="自备截图/封面图地址" value="${esc(c.preview||'')}" /></div>`+
      `<p class="hint">无自备预览时，会尝试用公开缩略图服务显示页面截图；失败则退回站点图标。纯前端无法保证所有网站都能截到。</p>`+
      `<div class="field"><label>批注</label><textarea id="fnote" placeholder="这则链接和当前推理有什么关系？">${esc(c.note||'')}</textarea></div>`+
      `<div class="actions"><button class="btn primary" id="saveCard">保存</button>${c.url?`<a class="btn" id="openUrl" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">打开网页</a>`:''}<button class="btn" id="makeLink">从这里连线</button><button class="btn" id="delCard">删除</button></div>`;
    animInspectorContent();
    document.querySelector('#saveCard').onclick=()=>{
      c.cardScale=document.querySelector('#fscale').value;c.kind=document.querySelector('#fkind').value;
      c.title=document.querySelector('#ftitle').value.trim()||'无标题';
      const rawUrl=document.querySelector('#furl').value.trim();
      c.url=tryParseUrl(rawUrl)||'';
      if(!c.url&&rawUrl)toastMsg('请填写以 http(s) 开头的有效网址。');
      c.preview=document.querySelector('#fpreview').value.trim();
      c.note=document.querySelector('#fnote').value.trim();
      if(c.url&&c.kind!=='链接'&&!['来源','线索'].includes(c.kind))c.kind='链接';
      if(c.url&&(!c.title||c.title==='无标题'))c.title=hostOf(c.url)||'网页链接';
      render();openInspector();toastMsg('已保存。');
    };
    document.querySelector('#makeLink').onclick=()=>enterLinkMode(c.id);
    document.querySelector('#delCard').onclick=()=>{state.cards=state.cards.filter(x=>x.id!==c.id);state.links=state.links.filter(x=>x.from!==c.id&&x.to!==c.id);selected=null;selectedLink=null;clearLinkMode();setPanel('right',false);inspectorContent.innerHTML=EMPTY_INSPECTOR;render()};
  }
  const EMPTY_INSPECTOR='<h2>放大一张卡片</h2><p class="empty-note">点线索卡可编辑；粘贴网址或点「＋ 链接」可钉上带预览的链接剪报并写批注；点连线可改颜色、标志或删除。</p>';
  function selectLink(i){if(i<0||i>=state.links.length)return;selectedLink=i;selected=null;markCards();drawLinks();openLinkInspector()}
  function clearLinkSelection(){selectedLink=null;drawLinks();if(!selected){inspectorContent.innerHTML=EMPTY_INSPECTOR}}
  function openLinkInspector(){
    const lk=state.links[selectedLink];if(!lk)return;setPanel('right',true);
    const from=state.cards.find(c=>c.id===lk.from),to=state.cards.find(c=>c.id===lk.to);
    const w=lk.width||state.lineWidth||2,col=lk.color||state.lineColor;
    inspectorContent.innerHTML=`<h2>连线详情</h2>`+
      `<p class="empty-note">${esc(from?.title||'?')} → ${esc(to?.title||'?')}</p>`+
      `<div class="field"><label>颜色</label><div class="swatches" id="lcolor">${swatchHtml(col,'link')}</div></div>`+
      `<div class="field"><label>标志</label><select id="lmarker">${MARKERS.map(([v,t])=>`<option value="${v}" ${(lk.marker||'none')===v?'selected':''}>${t}</option>`).join('')}</select></div>`+
      `<div class="field"><label>粗细 (<span id="lwval">${w}</span> px)</label><input type="range" id="lwidth" min="1" max="10" value="${w}"></div>`+
      `<div class="actions"><button class="btn" id="linkFlip">调换方向</button><button class="btn primary" id="linkDone">完成</button><button class="btn" id="linkDel">删除连线</button></div>`;
    bindSwatches(document.querySelector('#lcolor'),()=>lk.color||state.lineColor,c=>{lk.color=c;drawLinks();save()});
    document.querySelector('#lmarker').onchange=e=>{lk.marker=e.target.value;drawLinks();save()};
    const lw=document.querySelector('#lwidth');lw.oninput=e=>{lk.width=+e.target.value;document.querySelector('#lwval').textContent=lk.width;drawLinks();save()};
    document.querySelector('#linkFlip').onclick=()=>{[lk.from,lk.to]=[lk.to,lk.from];drawLinks();save();openLinkInspector()};
    document.querySelector('#linkDone').onclick=()=>{clearLinkSelection();setPanel('right',false)};
    document.querySelector('#linkDel').onclick=()=>{state.links.splice(selectedLink,1);selectedLink=null;drawLinks();save();inspectorContent.innerHTML=EMPTY_INSPECTOR;setPanel('right',false);toastMsg('连线已删除。')};
    animInspectorContent();
  }
  function clearSelection(){
    const had=selected!=null||selectedLink!=null||linking;
    if(selected)saveDraft();
    selected=null;selectedLink=null;linking=null;
    markCards();drawLinks();
    inspectorContent.innerHTML=EMPTY_INSPECTOR;
    return had;
  }
  function startPan(e){if(e.target.closest('.card')||e.target.classList?.contains('link-hit'))return;clearSelection();pan={x:e.clientX,y:e.clientY,cx:camera.x,cy:camera.y,moved:false};boardWrap.classList.add('panning');window.addEventListener('pointermove',movePan);window.addEventListener('pointerup',endPan,{once:true})}
  function movePan(e){if(!pan)return;pan.moved=true;camera.x=pan.cx+e.clientX-pan.x;camera.y=pan.cy+e.clientY-pan.y;applyStyle()}
  function endPan(){window.removeEventListener('pointermove',movePan);boardWrap.classList.remove('panning');if(pan){save();setTimeout(()=>pan=null,0)}}
  function setZoom(next,anchor){
    const r=boardWrap.getBoundingClientRect(),point=anchor||{x:r.width/2,y:r.height/2};
    const wx=(point.x-camera.x)/scale,wy=(point.y-camera.y)/scale;
    scale=Math.max(.35,Math.min(1.8,next));
    camera.x=point.x-wx*scale;camera.y=point.y-wy*scale;applyStyle();save();
  }
  function wheelZoom(e){
    e.preventDefault();
    if(drag||pan||!e.deltaY)return;
    const r=boardWrap.getBoundingClientRect();
    const unit=e.deltaMode===1?16:e.deltaMode===2?r.height:1;
    const delta=Math.max(-120,Math.min(120,e.deltaY*unit));
    setZoom(scale*Math.exp(-delta*.002),{x:e.clientX-r.left,y:e.clientY-r.top});
  }
  boardWrap.addEventListener('wheel',wheelZoom,{passive:false});
  function updateBoardSelect(){
    const select=document.querySelector('#boardSelect');select.replaceChildren();
    workspace.boards.forEach((b,i)=>{const option=document.createElement('option');option.value=b.id;option.textContent=`${i+1}. ${b.data.caseTitle}`;select.appendChild(option)});
    select.value=workspace.activeId;
  }
  function saveDraft(){
    const c=state.cards.find(c=>c.id===selected),title=document.querySelector('#ftitle');
    if(c&&title){
      c.title=title.value.trim()||'无标题';c.note=document.querySelector('#fnote').value;c.kind=document.querySelector('#fkind').value;c.cardScale=document.querySelector('#fscale').value;
      const fu=document.querySelector('#furl'),fp=document.querySelector('#fpreview');
      if(fu){const raw=fu.value.trim();c.url=tryParseUrl(raw)||raw}
      if(fp)c.preview=fp.value.trim();
    }
    save();
  }
  function activateBoard(id){
    const entry=workspace.boards.find(b=>b.id===id);if(!entry)return;
    workspace.activeId=id;state=entry.data;state.lineWidth||=2;normalizeLinks(state);selected=null;selectedLink=null;linking=null;drag=null;pan=null;
    window.removeEventListener('pointermove',moveDrag);window.removeEventListener('pointermove',movePan);
    boardWrap.classList.remove('panning');
    scale=state.camera?.scale||1;camera={x:state.camera?.x||0,y:state.camera?.y||0};
    leftOpen=narrowScreen.matches?false:state.panels?.left!==false;rightOpen=false;updatePanels();
    inspectorContent.innerHTML=EMPTY_INSPECTOR;
    render();updateBoardSelect();boardWrap.focus({preventScroll:true});
  }
  function newBoardFromText(text=''){
    saveDraft();
    const title=text.trim().split(/\r?\n/).find(line=>line.trim())?.trim().slice(0,40)||'未命名板子';
    const id=crypto.randomUUID();
    workspace.boards.push({id,data:{caseTitle:title,cards:[],links:[],boardColor:state.boardColor,lineColor:state.lineColor,lineWidth:state.lineWidth||2,camera:{x:0,y:0,scale:1},panels:{left:false,right:false}}});
    activateBoard(id);
    if(text){
      setPanel('right',true);
      const r=boardWrap.getBoundingClientRect();
      const card={id:crypto.randomUUID(),cardScale:'研究判断',kind:'线索',title,note:text,x:r.width/2-114,y:r.height/2-62,tilt:'0deg'};
      state.cards.push(card);selected=card.id;render();openInspector();boardWrap.focus({preventScroll:true});
    }
    toastMsg(text?'已新建板子，全文已放入卡片。':'已新建空白板子。');
  }
  document.querySelector('#boardSelect').onchange=e=>{saveDraft();activateBoard(e.target.value)};
  document.querySelector('#newBoard').onclick=()=>newBoardFromText();
  document.addEventListener('paste',e=>{
    if(e.defaultPrevented||e.target instanceof Element&&(e.target.closest('input,textarea,select')||e.target.isContentEditable))return;
    const text=e.clipboardData?.getData('text/plain');if(!text||!text.trim())return;
    e.preventDefault();
    const url=tryParseUrl(text.trim());
    if(url){addLinkCard(url);return}
    newBoardFromText(text);
  });
  updateBoardSelect();
  function addLinkCard(url=''){
    saveDraft();
    const r=boardWrap.getBoundingClientRect(),parsed=tryParseUrl(url)||'';
    const host=hostOf(parsed)||'网页链接';
    const c={id:crypto.randomUUID(),cardScale:'观察 / 证据',kind:'链接',title:host,url:parsed,preview:'',note:'',x:(r.width/2-camera.x)/scale-105,y:(r.height/2-camera.y)/scale-88,tilt:(Math.random()>.5?'-1.2deg':'1.2deg')};
    state.cards.push(c);selected=c.id;render();openInspector();
    const fu=document.querySelector('#furl');if(fu){fu.focus();fu.select()}
    toastMsg(parsed?'已钉上一张链接剪报。':'填写网址，保存后会显示预览。');
  }
  function add(){let r=boardWrap.getBoundingClientRect(),c={id:crypto.randomUUID(),cardScale:'观察 / 证据',kind:'线索',title:'新线索',note:'它让我想到什么？证据是什么？',x:(r.width/2-camera.x)/scale-71,y:(r.height/2-camera.y)/scale-38,tilt:'0deg'};state.cards.push(c);selected=c.id;render();openInspector();document.querySelector('#ftitle').focus();document.querySelector('#ftitle').select()}
  function toastMsg(m){toast.textContent=m;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
  document.querySelector('#addLinkBtn').onclick=()=>addLinkCard();
  document.querySelector('#addBtn').onclick=add;document.querySelector('#linkBtn').onclick=()=>{if(linking){clearLinkMode();toastMsg('已退出连线模式。');return}enterLinkMode(selected)};document.querySelector('#zoomIn').onclick=()=>setZoom(Math.min(1.8,+(scale+.1).toFixed(2)));document.querySelector('#zoomOut').onclick=()=>setZoom(Math.max(.35,+(scale-.1).toFixed(2)));document.querySelector('#boardColor').oninput=e=>{state.boardColor=e.target.value;applyStyle();save()};document.querySelector('#lineWidth').oninput=e=>{state.lineWidth=+e.target.value;document.querySelector('#lineWidthVal').textContent=state.lineWidth;drawLinks();save()};boardWrap.addEventListener('pointerdown',startPan);render();
  </script>
</body></html>
